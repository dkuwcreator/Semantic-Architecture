version: '3.8'

services:
  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
      container_name: semantic-test
    volumes:
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - test-results:/app/test-results
      - coverage-reports:/app/htmlcov
    environment:
      - TESTING=true
      - PYTHONPATH=/app
    command: >
      sh -c "
        pytest -v --tb=short --cov=scripts --cov-report=term-missing --cov-report=html:/app/htmlcov --cov-report=xml:/app/test-results/coverage.xml --junit-xml=/app/test-results/junit.xml &&
        echo 'Test results saved to /app/test-results' &&
        echo 'Coverage report saved to /app/htmlcov'
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  test-results:
  coverage-reports:
